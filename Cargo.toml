[workspace]
resolver = "2"
members = [
    "crates/cln-shared",
    "crates/cln-layout",
    "crates/cln-install",
    "crates/cln-project",
    "crates/cln-dispatch",
    "crates/cln-run",
    "crates/cln-register",
    "crates/cln-cli",
    "testing/fake-framework",
    "testing/fake-runtime",
]

[workspace.package]
version = "0.1.12"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ivan-Pasco/clean-manager"

[workspace.dependencies]
cln-shared = { path = "crates/cln-shared" }
cln-layout = { path = "crates/cln-layout" }
cln-install = { path = "crates/cln-install" }
cln-project = { path = "crates/cln-project" }
cln-dispatch = { path = "crates/cln-dispatch" }
cln-run = { path = "crates/cln-run" }
cln-register = { path = "crates/cln-register" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
