name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The dispatch tests run the real `cln` against `testing/fake-framework`,
      # copying its `clean-framework` binary into a temp toolchain. That binary
      # has to be built explicitly: `cargo test` builds the binaries of crates
      # it *tests*, and fake-framework is bin-only with no tests of its own, so
      # neither `--workspace` nor `--all-targets` produces it. Skipping this
      # leaves the suite green on any machine where an earlier build happened to
      # leave the artifact in target/, and red on a clean checkout like CI.
      - name: build test doubles
        run: cargo build --locked -p fake-framework

      - name: test
        run: cargo test --locked --workspace

  vendored-wit:
    name: vendored host contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The upstream comparison needs clean-server's tags, so fetch-depth: 0
      # plus fetch-tags (checkout defaults the latter to false, which would
      # leave the comparison permanently "pending" even once the tag lands).
      # Without a usable checkout the script still runs the local pin check and
      # reports the upstream leg as skipped rather than passing it silently.
      - name: check out clean-server
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Ivan-Pasco/clean-server
          path: .upstream/clean-server
          fetch-depth: 0
          fetch-tags: true

      - name: check vendored contracts against pins and upstream
        env:
          CLEAN_SERVER_DIR: ${{ github.workspace }}/.upstream/clean-server
        run: ./scripts/check_vendored_wit.sh
