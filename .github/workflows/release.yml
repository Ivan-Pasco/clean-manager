name: release

# Triggered by pushing a `v*` tag from comita (STEP 3).
# Publishes one archive per platform plus a `.sha256` sidecar per archive,
# matching the filename convention cln-install::channels parses:
#   cln-<version>-<os>-<arch>.<ext>[.sha256]

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
            ext: tar.gz
          - runner: macos-13
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin
            ext: tar.gz
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - runner: windows-latest
            os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            ext: zip
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build cln
        run: cargo build --release --locked --target ${{ matrix.target }} -p cln-cli

      - name: derive version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "asset_base=cln-${tag#v}-${{ matrix.os }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: stage archive contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir stage
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/cln.exe" stage/
          else
            cp "target/${{ matrix.target }}/release/cln" stage/
            chmod +x stage/cln
          fi

      - name: pack tar.gz
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.version.outputs.asset_base }}.tar.gz"
          tar -C stage -czf "$name" .
          shasum -a 256 "$name" | awk '{print $1"  "$2}' > "$name.sha256"
          ls -la "$name" "$name.sha256"

      - name: pack zip
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $name = "${{ steps.version.outputs.asset_base }}.zip"
          Compress-Archive -Path stage/* -DestinationPath $name
          $hash = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "$name.sha256" -Encoding ascii -NoNewline

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cln-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            cln-*.tar.gz
            cln-*.tar.gz.sha256
            cln-*.zip
            cln-*.zip.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list assets
        run: ls -la dist

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
